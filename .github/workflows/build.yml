name: Build
permissions: write-all
on:
  push:
    tags:
      - '*'

jobs:
  prepare_release:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.release_meta.outputs.tag_name }}
      package_version: ${{ steps.release_meta.outputs.package_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: '0'
          fetch-tags: 'true'

      - name: Resolve Release Meta
        id: release_meta
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          CLEAN_VERSION=$(echo "$TAG_NAME" | sed 's/^v//')

          if [[ ! "$CLEAN_VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Invalid version format: $TAG_NAME"
            exit 1
          fi

          if [[ "$CLEAN_VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
            PACKAGE_VERSION="${CLEAN_VERSION}.0"
          else
            PACKAGE_VERSION="$CLEAN_VERSION"
          fi

          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "package_version=$PACKAGE_VERSION" >> $GITHUB_OUTPUT

      - name: Update Version
        run: |
          jq --arg version "${{ steps.release_meta.outputs.package_version }}" '.version = $version' package.json > tmp.json && mv tmp.json package.json

      - name: Generate Release Notes
        env:
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag_name }}
          RELEASE_VERSION: ${{ steps.release_meta.outputs.package_version }}
          RELEASE_NOTES_FILE: release-notes.md
        run: node scripts/release-notes.mjs

      - name: Prepare Draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.release_meta.outputs.tag_name }}
        shell: bash
        run: |
          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            gh release edit "$TAG_NAME" --draft --title "$TAG_NAME" --notes-file release-notes.md
          else
            gh release create "$TAG_NAME" --draft --verify-tag --title "$TAG_NAME" --notes-file release-notes.md
          fi

          RELEASE_ID=$(gh release view "$TAG_NAME" --json databaseId --jq '.databaseId')
          gh api "repos/${{ github.repository }}/releases/$RELEASE_ID/assets?per_page=100" \
            --paginate --jq '.[].id' | while read -r asset_id; do
              gh api --method DELETE "repos/${{ github.repository }}/releases/assets/$asset_id"
            done

  build:
    needs: [prepare_release]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            arch: x64
            format: 7z
          - os: windows-latest
            arch: x64
            format: nsis
          - os: windows-latest
            arch: arm64
            format: 7z
          - os: windows-latest
            arch: arm64
            format: nsis

          - os: ubuntu-latest
            arch: x64
            format: deb
          - os: ubuntu-latest
            arch: x64
            format: rpm
          - os: ubuntu-latest
            arch: x64
            format: pacman
          - os: ubuntu-latest
            arch: arm64
            format: deb
          - os: ubuntu-latest
            arch: arm64
            format: rpm
          - os: ubuntu-latest
            arch: arm64
            format: pacman
          - os: ubuntu-latest
            arch: loong64
            format: deb
          - os: ubuntu-latest
            arch: loong64
            format: rpm
          - os: ubuntu-latest
            arch: loong64
            format: pacman

          - os: macos-latest
            arch: x64
          - os: macos-latest
            arch: arm64

    name: Build ${{ matrix.os }}-${{ matrix.arch }}${{ matrix.format && '-' || '' }}${{ matrix.format || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: '0'
          fetch-tags: 'true'

      - name: Setup pnpm
        run: npm install -g pnpm

      - name: Determine and Update Version
        shell: bash
        run: |
          INPUT_VERSION="${GITHUB_REF_NAME}"
          CLEAN_VERSION=$(echo "$INPUT_VERSION" | sed 's/^v//')

          if [[ ! "$CLEAN_VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Invalid version format: $INPUT_VERSION"
            exit 1
          fi

          if [[ "$CLEAN_VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
            RELEASE_VERSION="${CLEAN_VERSION}.0"
          else
            RELEASE_VERSION="$CLEAN_VERSION"
          fi

          jq --arg version "$RELEASE_VERSION" '.version = $version' package.json > tmp.json && mv tmp.json package.json

      - name: Keep product name lowercase on Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          sed -i "s/productName: Perzike/productName: perzike/" electron-builder.yml

      - name: Install Build Tools
        if: matrix.os == 'ubuntu-latest' && matrix.format == 'pacman'
        run: |
          sudo apt-get update && sudo apt-get install -y libarchive-tools fakeroot

      - name: Adaptation to the loongarch64 architecture
        env:
          npm_config_arch: ${{ matrix.arch }}
          npm_config_target_arch: ${{ matrix.arch }}
        if: matrix.os == 'ubuntu-latest' && matrix.arch == 'loong64'
        shell: bash
        run: |
          export ELECTRON_MIRROR="https://github.com/darkyzhou/electron-loong64/releases/download/"
          export electron_use_remote_checksums=1
          SKIP_PREPARE=1 pnpm install electron@39.2.7 -D
          pnpm remove electron-builder
          SKIP_PREPARE=1 pnpm install @loongdotjs/electron-builder@26.8.2-loong1 -D

      - name: Install Dependencies and Prepare
        env:
          npm_config_arch: ${{ matrix.arch }}
          npm_config_target_arch: ${{ matrix.arch }}
        shell: bash
        run: |
          SKIP_PREPARE=1 pnpm install
          pnpm prepare --${{ matrix.arch }}

      - name: Build
        env:
          npm_config_arch: ${{ matrix.arch }}
          npm_config_target_arch: ${{ matrix.arch }}
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            pnpm build:win ${{ matrix.format }} --${{ matrix.arch }}
          elif [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            if [[ "${{ matrix.arch }}" == "loong64" ]]; then
              export ELECTRON_MIRROR="https://github.com/darkyzhou/electron-loong64/releases/download/"
              export electron_use_remote_checksums=1
              pnpm build:linux ${{ matrix.format }} --${{ matrix.arch }}
            else
              pnpm build:linux ${{ matrix.format }} --${{ matrix.arch }}
            fi
          else
            pnpm build:mac --${{ matrix.arch }}
          fi

      - name: Add Portable Flag
        if: matrix.os == 'windows-latest' && matrix.format == '7z'
        shell: pwsh
        run: |
          New-Item -Path "PORTABLE" -ItemType File
          Get-ChildItem dist/*portable.7z | ForEach-Object {
            7z a $_.FullName PORTABLE
          }

      - name: Upload Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare_release.outputs.tag_name }}
        shell: bash
        run: |
          shopt -s nullglob
          ASSETS=()

          for asset in dist/perzike*; do
            if [[ -f "$asset" && "$asset" != *.blockmap && "$asset" != "dist/perzike.app.plist" ]]; then
              ASSETS+=("$asset")
            fi
          done

          if (( ${#ASSETS[@]} == 0 )); then
            echo "No release assets found"
            exit 1
          fi

          gh release upload "$TAG_NAME" "${ASSETS[@]}" --clobber

  release:
    needs: [prepare_release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: '0'
          fetch-tags: 'true'

      - name: Update Version
        run: |
          jq --arg version "${{ needs.prepare_release.outputs.package_version }}" '.version = $version' package.json > tmp.json && mv tmp.json package.json

      - name: Generate Release Notes
        env:
          RELEASE_TAG: ${{ needs.prepare_release.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.prepare_release.outputs.package_version }}
          RELEASE_NOTES_FILE: release-notes.md
        run: node scripts/release-notes.mjs

      - name: Install Dependencies and Updater
        run: |
          npm install -g pnpm
          SKIP_PREPARE=1 pnpm install
          RELEASE_NOTES_FILE=release-notes.md pnpm updater

      - name: Upload Release Metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare_release.outputs.tag_name }}
        shell: bash
        run: gh release upload "$TAG_NAME" latest.yml --clobber

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare_release.outputs.tag_name }}
        shell: bash
        run: gh release edit "$TAG_NAME" --draft=false --title "$TAG_NAME" --notes-file release-notes.md
